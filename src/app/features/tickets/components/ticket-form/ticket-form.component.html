<div class="form-container">
  <!-- Cabecera del formulario -->
  <div class="form-header">
    <h3>Crear ticket</h3>
    <p>Registre una solicitud con la información necesaria para darle seguimiento.</p>
  </div>

  <!-- Formulario Reactivo -->
  <form [formGroup]="ticketForm" (ngSubmit)="onSubmit()" class="ticket-form">

    <!-- Asunto (Ancho completo) -->
    <div class="form-group full-width">
      <label for="asunto">Asunto</label>
      <input
        id="asunto"
        type="text"
        formControlName="asunto"
        placeholder="¿En qué podemos ayudarte?"
        [class.is-invalid]="ticketForm.controls.asunto.touched && ticketForm.controls.asunto.invalid"
      >
    </div>

    <!-- Fila de Categoría y Prioridad (2 columnas) -->
    <div class="form-row">
      <div class="form-group half-width">
        <label for="categoria">Categoría</label>
        <select id="categoria" formControlName="categoria">
          @for (cat of categorias; track cat) {
            <option [value]="cat">{{ cat }}</option>
          }
        </select>
      </div>

      <div class="form-group half-width">
        <label for="prioridad">Prioridad</label>
        <select id="prioridad" formControlName="prioridad">
          @for (pri of prioridades; track pri) {
            <option [value]="pri">{{ pri }}</option>
          }
        </select>
      </div>
    </div>

    <!-- Descripción (Ancho completo) -->
    <div class="form-group full-width">
      <label for="descripcion">Descripción</label>
      <textarea
        id="descripcion"
        formControlName="descripcion"
        rows="4"
        placeholder="Describa el problema o solicitud..."
        [class.is-invalid]="ticketForm.controls.descripcion.touched && ticketForm.controls.descripcion.invalid"
      ></textarea>
    </div>

    <!-- Acciones / Botones -->
    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="onCancel()">Cancelar</button>
      <button type="submit" class="btn-primary" [disabled]="ticketForm.invalid">
        <span class="material-symbols-outlined">add</span>
        Crear ticket
      </button>
    </div>

  </form>
</div>
